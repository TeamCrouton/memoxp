server {
  listen 80;
  root /usr/share/nginx/html;

  # Les appels /api/... partent vers le conteneur (ou le Service Kubernetes) "api"
  location /api/ {
    proxy_pass http://api:4000;
    proxy_set_header Host $host;
  }

  # index.html jamais en cache, sinon les visiteurs gardent l'ancienne version
  location = /index.html {
    add_header Cache-Control "no-cache";
  }

  # Une route inconnue renvoie l'application React (pas un 404)
  location / {
    try_files $uri /index.html;
  }
}
