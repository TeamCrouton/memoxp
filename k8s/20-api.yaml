apiVersion: v1
kind: Service
metadata:
  name: api # le nom que Nginx utilise (proxy_pass http://api:4000)
  namespace: memoxp
spec:
  selector:
    app: api
  ports:
    - port: 4000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: memoxp
spec:
  replicas: 2
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      terminationGracePeriodSeconds: 15
      containers:
        - name: api
          image: ghcr.io/ORGANISATION/memoxp-api:prod
          imagePullPolicy: Always
          env:
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: db
                  key: password
            - name: DATABASE_URL
              value: postgres://memoxp:$(DB_PASSWORD)@db:5432/memoxp
          ports:
            - containerPort: 4000
          readinessProbe: # recoit du trafic seulement si la base repond
            httpGet:
              path: /health
              port: 4000
            periodSeconds: 5
          livenessProbe: # redemarre s'il ne repond plus du tout
            tcpSocket:
              port: 4000
            initialDelaySeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 256Mi
